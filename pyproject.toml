[project]
name = "aifreeradar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-harness[researcher,anthropic]==0.66.0",
    "pydantic-ai-slim[openai]==2.66.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "python-dotenv>=1.0,<2",
    "filelock>=3.16,<4",
    "markdown-it-py>=3,<5",
    "cryptography>=43,<47",
]

[project.scripts]
aifreeradar = "aifreeradar.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "pyright>=1.1,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aifreeradar"]
include = [
    "aifreeradar/*.py",
    "aifreeradar/static/app/**",
]
artifacts = [
    "aifreeradar/static/app/**",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "aifreeradar/**",
    "frontend/**",
    "hatch_build.py",
    "pyproject.toml",
    "uv.lock",
    "README.md",
]
artifacts = [
    "aifreeradar/static/app/**",
]
exclude = [
    "frontend/node_modules/**",
    "frontend/.vite/**",
    "frontend/*.tsbuildinfo",
]
